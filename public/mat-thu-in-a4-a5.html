<script>
const CARDS = [{"id":"C01","from":0,"to":1,"route":"MẬT THƯ 3 LỚP · ATBASH + XOAY\n\nOT — Giữa ngã rẽ, điều nhỏ nhất đôi khi là chiếc khóa.\nƯơm một giả thuyết, rồi dùng dữ kiện để kiểm tra.\nÔ cửa đúng chỉ mở sau khi hai lớp đều khớp.\nNgười giữ khóa không nên tự giải một mình.\nGiữa ngã rẽ, điều nhỏ nhất đôi khi là chiếc khóa.\n“Gương chữ cái” nghĩa là A↔Z, B↔Y. Sau đó xoay tiến đúng số La Mã: II.\n\nNW — INPPBKIOXY\n\nKIỂM CHỨNG — Đảo ngược chuỗi NW → soi gương bảng chữ → xoay tiến II. MÃ ĐÍCH sau cùng có dạng: DEN TRAM \u003ctên-số>. Đối chiếu bảng D00–D07, không suy đoán từ khoảng cách.","fragment":"Đọc ngược toàn bộ chuỗi: HNAH IOHK. Đây là lời chúc xuất phát, không phải mảnh ghép cuối."},{"id":"C02","from":0,"to":2,"route":"MẬT THƯ 3 LỚP · MORSE + ĐẢO KHỐI\n\nOT — Người giữ khóa không nên tự giải một mình.\nGiữa ngã rẽ, điều nhỏ nhất đôi khi là chiếc khóa.\nHãy chia vai: người nhìn, người tính, người ghi.\nEm đừng vội tin kết quả đầu tiên vừa tìm được.\nTừ đầu dòng cho biết cách đọc: NGHE. Dấu / ngăn chữ, | ngăn khối; hãy đổi Morse, nối các khối theo thứ tự in rồi đọc ngược toàn bộ chuỗi.\n\nNW — ../.-/..../-- | .-/.-./-/-. | ./-..\n\nKIỂM CHỨNG — MÃ ĐÍCH sau cùng có dạng: DEN TRAM \u003ctên-số>. Đối chiếu bảng D00–D07, không suy đoán từ khoảng cách.","fragment":"Đọc ngược toàn bộ chuỗi: HNAH IOHK. Đây là lời chúc xuất phát, không phải mảnh ghép cuối."},{"id":"C03","from":0,"to":3,"route":"MẬT THƯ 3 LỚP · Ô VUÔNG 5×5\n\nOT — Từng bước đúng quan trọng hơn một đáp án vội vàng.\nÔ cửa đúng chỉ mở sau khi hai lớp đều khớp.\nAi giữ được bình tĩnh mới nhìn ra đường đi.\nDưới lớp chữ bình thường thường còn một quy tắc khác.\nÔ cửa đúng chỉ mở sau khi hai lớp đều khớp.\nLấy chữ đầu: TOA DO. Dùng bảng Polybius: 11=A, 12=B… 15=E; 21=F… 55=Z (I/J chung ô).\n\nNW — 11 12 32 11 42 44 33 15 14\n\nKIỂM CHỨNG — Giải tọa độ rồi đọc chuỗi theo chiều ngược lại. MÃ ĐÍCH sau cùng có dạng: DEN TRAM \u003ctên-số>. Đối chiếu bảng D00–D07, không suy đoán từ khoảng cách.","fragment":"Đọc ngược toàn bộ chuỗi: HNAH IOHK. Đây là lời chúc xuất phát, không phải mảnh ghép cuối."},{"id":"C04","from":0,"to":4,"route":"MẬT THƯ 3 LỚP · BACON\n\nOT — Người giữ khóa không nên tự giải một mình.\nHãy chia vai: người nhìn, người tính, người ghi.\nIm lặng quan sát, rồi mới chọn bước tiếp theo.\nPhía trước không xa, nhưng không dành cho người hấp tấp.\nHãy chia vai: người nhìn, người tính, người ghi.\nAi giữ được bình tĩnh mới nhìn ra đường đi.\nNgười giữ khóa không nên tự giải một mình.\nChữ đầu nói NHI PHAN. Quy ước S=0, D=1; mỗi 5 dấu là một chữ A=00000… Z=11001.\n\nNW — SSSDD SSDSS SDDSD DSSDD DSSSD SSSSS SDDSS SSSSD SDDDS SDDSD\n\nKIỂM CHỨNG — MÃ ĐÍCH sau cùng có dạng: DEN TRAM \u003ctên-số>. Đối chiếu bảng D00–D07, không suy đoán từ khoảng cách.","fragment":"Đọc ngược toàn bộ chuỗi: HNAH IOHK. Đây là lời chúc xuất phát, không phải mảnh ghép cuối."},{"id":"C05","from":0,"to":5,"route":"MẬT THƯ 3 LỚP · HÀM AFFINE\n\nOT — Mỗi ký tự đều có lý do xuất hiện trên phiếu.\nÔ cửa đúng chỉ mở sau khi hai lớp đều khớp.\nDưới lớp chữ bình thường thường còn một quy tắc khác.\nƯơm một giả thuyết, rồi dùng dữ kiện để kiểm tra.\nLúc còn phân vân, hãy trở về điểm bắt đầu.\nÔ cửa đúng chỉ mở sau khi hai lớp đều khớp.\nChữ đầu: MODULO. Đánh A=0…Z=25. Trên bản mã dùng C=(5P+8) mod 26; hãy tìm P, rồi đọc ngược.\n\nNW — QIVQIPZVCX\n\nKIỂM CHỨNG — MÃ ĐÍCH sau cùng có dạng: DEN TRAM \u003ctên-số>. Đối chiếu bảng D00–D07, không suy đoán từ khoảng cách.","fragment":"Đọc ngược toàn bộ chuỗi: HNAH IOHK. Đây là lời chúc xuất phát, không phải mảnh ghép cuối."},{"id":"C06","from":0,"to":6,"route":"MẬT THƯ 3 LỚP · LƯỚI CỘT\n\nOT — Dưới lớp chữ bình thường thường còn một quy tắc khác.\nÔ cửa đúng chỉ mở sau khi hai lớp đều khớp.\nCả đội chỉ có thể qua trạm khi cùng kiểm chứng.\nCả đội chỉ có thể qua trạm khi cùng kiểm chứng.\nÔ cửa đúng chỉ mở sau khi hai lớp đều khớp.\nTừng bước đúng quan trọng hơn một đáp án vội vàng.\nLấy chữ đầu: DOC COT. Bản mã gồm 4 cột, phát theo thứ tự cột 2 → 4 →  — MÃ ĐÍCH sau cùng có dạng: VE TRUNG TAM. Đối chiếu bảng D00–D07, không suy đoán từ khoảng cách.","fragment":"Câu hỏi của trạm không hỏi “hôm qua ta đã làm gì?”, mà hỏi “ngày mai ta muốn đến đâu?”. Hãy gọi tên hướng nhìn về phía trước. Ghi một cụm gồm hai tiếng."},{"id":"R50","from":5,"to":0,"route":"MẬT THƯ 3 LỚP · ATBASH + XOAY\n\nOT — Giữa ngã rẽ, điều nhỏ nhất đôi khi là chiếc khóa.\nƯơm một giả thuyết, rồi dùng dữ kiện để kiểm tra.\nÔ cửa đúng chỉ mở sau khi hai lớp đều khớp.\nNgười giữ khóa không nên tự giải một mình.\nGiữa ngã rẽ, điều nhỏ nhất đôi khi là chiếc khóa.\n“Gương chữ cái” nghĩa là A↔Z, B↔Y. Sau đó xoay tiến đúng số La Mã: VII.\n\nNW — UGNATMPNCL\n\nKIỂM CHỨNG — Đảo ngược chuỗi NW → soi gương bảng chữ → xoay tiến VII. MÃ ĐÍCH sau cùng có dạng: VE TRUNG TAM. Đối chiếu bảng D00–D07, không suy đoán từ khoảng cách.","fragment":"Từ bản vẽ, dữ liệu, mã nguồn và quy trình, con người tạo ra công cụ giải quyết vấn đề. Gọi tên lĩnh vực biến tri thức thành giải pháp. Ghi một cụm gồm hai tiếng."},{"id":"R60","from":6,"to":0,"route":"MẬT THƯ 3 LỚP · BACON\n\nOT — Người giữ khóa không nên tự giải một mình.\nHãy chia vai: người nhìn, người tính, người ghi.\nIm lặng quan sát, rồi mới chọn bước tiếp theo.\nPhía trước không xa, nhưng không dành cho người hấp tấp.\nHãy chia vai: người nhìn, người tính, người ghi.\nAi giữ được bình tĩnh mới nhìn ra đường đi.\nNgười giữ khóa không nên tự giải một mình.\nChữ đầu nói NHI PHAN. Quy ước S=0, D=1; mỗi 5 dấu là một chữ A=00000… Z=11001.\n\nNW — DSDSD SSDSS DSSDD DSSSD DSDSS SDDSD SSDDS DSSDD SSSSS SDDSS\n\nKIỂM CHỨNG — MÃ ĐÍCH sau cùng có dạng: VE TRUNG TAM. Đối chiếu bảng D00–D07, không suy đoán từ khoảng cách.","fragment":"Mọi giải pháp kỹ thuật cần trả lời: “làm điều này ___ ai, ___ mục đích gì?”. Ghi đúng từ nối biểu đạt động cơ phụng sự, chỉ một tiếng."},{"id":"R70","from":7,"to":0,"route":"MẬT THƯ 3 LỚP · VIGENÈRE\n\nOT — Khi những dấu hiệu nối lại, lối đi sẽ hiện ra.\nHãy chia vai: người nhìn, người tính, người ghi.\nÔ cửa đúng chỉ mở sau khi hai lớp đều khớp.\nAi giữ được bình tĩnh mới nhìn ra đường đi.\nLấy chữ đầu bốn dòng đầu làm khóa.\n\nNW — A=0…Z=25. Với khóa lặp K, giải P = C − K:\nFLHREUUTKT\n\nKIỂM CHỨNG — MÃ ĐÍCH sau cùng có dạng: VE TRUNG TAM. Đối chiếu bảng D00–D07, không suy đoán từ khoảng cách.","fragment":"Giá trị của giải pháp không dừng ở một cá nhân hay một đội; nó lan tới tập thể cùng sống, học tập và phát triển. Gọi tên chủ thể ấy. Ghi một cụm gồm hai tiếng."}];

const $ = (id) => document.getElementById(id);
const escapeHtml = (value) => String(value).replace(/[&<>\"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;' })[char]);
function options(select, first) { select.innerHTML = '<option value=\"all\">' + first + '</option>' + Object.keys(station).map((n) => '<option value=\"' + n + '\">' + station[n] + '</option>').join(''); }
function front(card, compact) { return '<section class=\"front-block\"><div class=\"card-top\"><span class=\"card-kicker\">TeamBuilding K26 · CN&KT DThU</span><span class=\"card-id\">' + escapeHtml(card.id) + '</span></div><h2 class=\"card-title\">A · Giải điểm đến</h2><p class=\"card-subtitle\">Giải mật mã dưới đây để tìm trạm tiếp theo. Giữ phiếu kín với đội khác.</p><div class=\"content-box\"><div class=\"label\">Mật mã định tuyến</div><p class=\"cipher\">' + escapeHtml(card.route) + '</p></div><div class=\"answer-line\"><p>Điểm đến đội bạn tìm được:</p><div class=\"blank\"></div></div><p class=\"foot\">Nộp hoặc mang phiếu này theo hướng dẫn của quản trò. Không ghi đáp án chung của chương trình lên phiếu.</p></section>'; }
function back(card) { return '<section class=\"back-block\"><div class=\"card-top\"><span class=\"card-kicker\">TeamBuilding K26 · CN&KT DThU</span><span class=\"card-id\">' + escapeHtml(card.id) + ' · Mặt B</span></div><h2 class=\"card-title\">B · Mảnh mang về</h2><p class=\"card-subtitle\">Đọc kỹ gợi ý, ghi lại cụm từ suy luận được và giữ đến lúc tập hợp ở Trạm Trung Tâm.</p><div class=\"content-box\"><div class=\"label\">Gợi ý ngữ nghĩa</div><p class=\"cipher\">' + escapeHtml(card.fragment) + '</p></div><div class=\"answer-line\"><p>Mảnh ghép đội bạn suy luận:</p><div class=\"blank\"></div></div><p class=\"foot\">Không có đáp án trực tiếp trên phiếu. Ghép các mảnh sau khi hoàn thành đủ thử thách.</p></section>'; }
function page(card, side, index) { const klass = side === 'back' ? 'back' : 'front'; return '<article class=\"print-sheet ' + klass + '\" data-number=\"' + (index + 1) + '\"><div class=\"sheet-inner\">' + (side === 'back' ? back(card) : front(card)) + '</div></article>'; }
function single(card, index) { return page(card, 'front', index) + page(card, 'back', index); }
function referencePage() { return '<article class=\"print-sheet reference\"><div class=\"sheet-inner\"><div class=\"card-top\"><span class=\"card-kicker\">TeamBuilding K26 · CN&KT DThU</span><span class=\"card-id\">BẢNG TRA</span></div><h2>Bảng địa điểm định tuyến</h2><p class=\"card-subtitle\">Giải ra mã D00–D07, sau đó đối chiếu bảng này để di chuyển. Phát kèm hoặc treo tại Trạm Trung Tâm.</p><table><thead><tr><th>Mã</th><th>Điểm đến</th><th>Tọa độ</th></tr></thead><tbody>' + locations.map((place) => '<tr><td class=\"code\">' + place.code + '</td><td>' + place.name + '</td><td>' + place.point + '</td></tr>').join('') + '</tbody></table><p class=\"foot\">Bảng này chỉ dùng để xác định vị trí; không chứa mảnh ghép đáp án cuối.</p></div></article>'; }
function render() { const from = $('from').value; const to = $('to').value; const mode = $('mode').value; const paper = $('paper').value; const selected = CARDS.filter((card) => (from === 'all' || String(card.from) === from) && (to === 'all' || String(card.to) === to)); document.body.classList.toggle('a5', paper === 'A5'); $('paper-style').textContent = '@page { size: ' + paper + ' portrait; margin: 10mm; }'; $('pages').innerHTML = referencePage() + selected.map((card, index) => mode === 'double' ? page(card, 'front', index) + page(card, 'back', index) : single(card, index)).join(''); $('counter').textContent = selected.length + ' mật thư được chọn · ' + (1 + selected.length * 2) + ' mặt in (đã gồm 1 bảng tra địa điểm).'; $('note').textContent = mode === 'double' ? 'In hai mặt: chọn “lật cạnh dài”. Hệ thống in trước 1 bảng tra địa điểm, rồi sắp từng cặp liên tiếp: mặt trước, mặt sau của cùng một mật thư.' : 'In một mặt: mỗi mật thư có 2 tờ — mặt A (điểm đến) và mặt B (mảnh mang về). Phát cả cặp cho đội; không cắt nhỏ nội dung.'; }
options($('from'), 'Tất cả tuyến · 56 mật thư'); options($('to'), 'Mọi điểm đến'); ['from','to','mode','paper'].forEach((id) => $(id).addEventListener('change', render)); $('print').addEventListener('click', () => window.print()); render();
